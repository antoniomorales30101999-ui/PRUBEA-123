<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RED TECAMAC - Análisis de Afectaciones</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00d4ff">
    
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background-color: #0f172a;
            border-color: #334155;
            color: #f8fafc;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #38bdf8;
            color: #f8fafc;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
        .btn-custom {
            background-color: #0284c7;
            color: white;
            font-weight: 600;
        }
        .btn-custom:hover {
            background-color: #0369a1;
            color: white;
        }
        .badge-user {
            background-color: #334155;
            color: #38bdf8;
            border: 1px solid #0284c7;
        }
        /* Estilos de alertas y tabla */
        .bg-hot { background-color: #7f1d1d !important; color: #fecaca !important; }
        .bg-warm { background-color: #7c2d12 !important; color: #fed7aa !important; }
        .bg-normal { background-color: #064e3b !important; color: #a7f3d0 !important; }
        .bg-inactive { background-color: #334155 !important; color: #94a3b8 !important; text-decoration: line-through; }
        .card-stat { background-color: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="loginContainer" class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card login-card p-4 w-100" style="max-width: 400px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-info mb-1">RED TECAMAC</h3>
                <p class="text-secondary small">Análisis de Afectaciones</p>
            </div>
            
            <form id="loginForm" onsubmit="event.preventDefault(); verificarAcceso();">
                <div class="mb-3">
                    <label for="userInput" class="form-label small text-uppercase fw-semibold text-secondary">Usuario</label>
                    <input type="text" id="userInput" class="form-control" placeholder="Ingresa tu usuario" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="passInput" class="form-label small text-uppercase fw-semibold text-secondary">Contraseña</label>
                    <input type="password" id="passInput" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                <div id="errorAlert" class="alert alert-danger py-2 small d-none" role="alert">
                    ⚠️ Usuario o contraseña incorrectos.
                </div>

                <button type="submit" class="btn btn-custom w-100 py-2 mt-2">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL DE LA APP -->
    <div id="appContainer" class="container-fluid py-3 d-none">
        
        <!-- Encabezado con Info de Usuario -->
        <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-dark rounded border border-secondary">
            <div>
                <h4 class="m-0 fw-bold text-info">RED TECAMAC</h4>
                <span class="badge badge-user mt-1" id="userBadge">Usuario: --</span>
            </div>
            <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>

        <!-- Panel de Buscador Individual -->
        <div class="card card-stat mb-4 p-3">
            <h5 class="text-info fw-bold mb-3">🔍 Búsqueda Individual</h5>
            <div class="row g-2">
                <div class="col-md-9 col-12">
                    <input type="text" id="searchInput" class="form-control" placeholder="Ingresa Cuenta, QR u OLT para filtrar...">
                </div>
                <div class="col-md-3 col-12">
                    <button class="btn btn-custom w-100" onclick="buscarManual()">Buscar / Filtrar</button>
                </div>
            </div>
        </div>

        <!-- Panel de Análisis Masivo -->
        <div class="card card-stat mb-4 p-3">
            <h5 class="text-info fw-bold mb-3">📊 Análisis Masivo de Afectaciones</h5>
            <div class="mb-3">
                <textarea id="masivoInput" class="form-control" rows="3" placeholder="Pega aquí el bloque de texto con Cuentas de reporte..."></textarea>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-warning fw-bold text-dark" onclick="procesarMasivo()">Procesar Lista</button>
                <button class="btn btn-outline-secondary" onclick="limpiarMasivo()">Limpiar</button>
            </div>
            
            <!-- Tarjetas de Resumen Masivo -->
            <div id="resumenMasivo" class="row mt-3 g-2 d-none">
                <div class="col-6 col-md-3">
                    <div class="p-2 rounded bg-hot text-center">
                        <small class="d-block fw-bold">HOT (Critical)</small>
                        <span id="cntHot" class="fs-4 fw-bold">0</span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="p-2 rounded bg-warm text-center">
                        <small class="d-block fw-bold">WARM (Warning)</small>
                        <span id="cntWarm" class="fs-4 fw-bold">0</span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="p-2 rounded bg-normal text-center">
                        <small class="d-block fw-bold">NORMAL</small>
                        <span id="cntNormal" class="fs-4 fw-bold">0</span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="p-2 rounded bg-inactive text-center">
                        <small class="d-block fw-bold">CANCELADOS/INACT</small>
                        <span id="cntInactivos" class="fs-4 fw-bold">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla General de Datos -->
        <div class="card card-stat p-3">
            <div class="table-responsive">
                <table id="tablaDatos" class="table table-dark table-striped table-hover w-100 align-middle">
                    <thead>
                        <tr>
                            <th>Cuenta</th>
                            <th>Estado</th>
                            <th>QR</th>
                            <th>OLT</th>
                            <th>Detalles</th>
                        </tr>
                    </thead>
                    <tbody id="tablaBody">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DE USUARIOS AUTORIZADOS
        // ==========================================
        const USUARIOS_AUTORIZADOS = {
            "ANTONIO": "Tecamac2026*",
            "MILDRED": "MA123",
            "SUPERVISOR": "Tecamac2026*",
            "FRANCISCO": "Tecamac2026*"
        };

        let dataTableInstancia = null;
        let datosCSVGlobal = [];

        document.addEventListener("DOMContentLoaded", function() {
            const usuarioGuardado = sessionStorage.getItem("usuario_tecamac");
            if (usuarioGuardado) {
                mostrarApp(usuarioGuardado);
            }
        });

        function verificarAcceso() {
            const user = document.getElementById("userInput").value.trim().toLowerCase();
            const pass = document.getElementById("passInput").value;
            const alertBox = document.getElementById("errorAlert");

            if (USUARIOS_AUTORIZADOS[user] && USUARIOS_AUTORIZADOS[user] === pass) {
                alertBox.classList.add("d-none");
                sessionStorage.setItem("usuario_tecamac", user);
                mostrarApp(user);
            } else {
                alertBox.classList.remove("d-none");
                document.getElementById("passInput").value = "";
                document.getElementById("passInput").focus();
            }
        }

        function mostrarApp(usuario) {
            document.getElementById("loginContainer").classList.add("d-none");
            document.getElementById("appContainer").classList.remove("d-none");
            document.getElementById("userBadge").innerText = "Usuario: " + usuario.toUpperCase();
            
            setTimeout(() => {
                cargarDatosCSV();
            }, 300);
        }

        function cerrarSesion() {
            sessionStorage.removeItem("usuario_tecamac");
            document.getElementById("appContainer").classList.add("d-none");
            document.getElementById("loginContainer").classList.remove("d-none");
            document.getElementById("userInput").value = "";
            document.getElementById("passInput").value = "";
            document.getElementById("errorAlert").classList.add("d-none");
        }

        // ==========================================
        // 2. LÓGICA DE DATOS CSV Y TABLA
        // ==========================================
        function cargarDatosCSV() {
            Papa.parse("./datos.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    datosCSVGlobal = results.data;
                    renderizarTabla(datosCSVGlobal);
                },
                error: function(err) {
                    console.error("Error cargando el archivo CSV:", err);
                }
            });
        }

        function renderizarTabla(datos) {
            if (dataTableInstancia) {
                dataTableInstancia.destroy();
            }

            const body = document.getElementById("tablaBody");
            body.innerHTML = "";

            datos.forEach(item => {
                const tr = document.createElement("tr");
                
                // Aplicar estilo de cancelado/inactivo si aplica
                const estado = (item.Estado || item.ESTADO || "").toUpperCase();
                if (estado.includes("CANCEL") || estado.includes("INACT") || estado.includes("BAJA")) {
                    tr.classList.add("bg-inactive");
                }

                tr.innerHTML = `
                    <td><strong>${item.Cuenta || item.CUENTA || '-'}</strong></td>
                    <td>${item.Estado || item.ESTADO || '-'}</td>
                    <td>${item.QR || item.qr || '-'}</td>
                    <td>${item.OLT || item.olt || '-'}</td>
                    <td>${item.Detalles || item.DETALLES || '-'}</td>
                `;
                body.appendChild(tr);
            });

            dataTableInstancia = $('#tablaDatos').DataTable({
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
                },
                pageLength: 10,
                responsive: true
            });
        }

        function buscarManual() {
            const val = document.getElementById("searchInput").value;
            if (dataTableInstancia) {
                dataTableInstancia.search(val).draw();
            }
        }

        // ==========================================
        // 3. ANÁLISIS MASIVO DE CUENTAS
        // ==========================================
        function procesarMasivo() {
            const texto = document.getElementById("masivoInput").value;
            if (!texto.trim()) return;

            // Extraer cuentas (_TP_ o 10 dígitos)
            const regex = /(_TP_\d+|\b\d{10}\b)/gi;
            const encontradas = [...new Set(texto.match(regex) || [])];

            if (encontradas.length === 0) {
                alert("No se encontraron coincidencias de cuentas válidas.");
                return;
            }

            // Filtrar los datos cargados correspondientes a las cuentas
            const coincidencia = datosCSVGlobal.filter(d => {
                const c = (d.Cuenta || d.CUENTA || "").trim();
                return encontradas.some(e => e.toLowerCase() === c.toLowerCase());
            });

            // Conteo por QR
            const conteoQR = {};
            let hot = 0, warm = 0, normal = 0, inactivos = 0;

            coincidencia.forEach(d => {
                const est = (d.Estado || d.ESTADO || "").toUpperCase();
                if (est.includes("CANCEL") || est.includes("INACT") || est.includes("BAJA")) {
                    inactivos++;
                } else {
                    const qr = d.QR || d.qr || "SIN_QR";
                    conteoQR[qr] = (conteoQR[qr] || 0) + 1;
                }
            });

            // Clasificación por nivel de criticidad
            Object.values(conteoQR).forEach(cnt => {
                if (cnt >= 5) hot++;
                else if (cnt >= 2) warm++;
                else normal++;
            });

            // Actualizar tarjetas de conteo
            document.getElementById("cntHot").innerText = hot;
            document.getElementById("cntWarm").innerText = warm;
            document.getElementById("cntNormal").innerText = normal;
            document.getElementById("cntInactivos").innerText = inactivos;
            document.getElementById("resumenMasivo").classList.remove("d-none");

            // Mostrar resultados en la tabla
            renderizarTabla(coincidencia);
        }

        function limpiarMasivo() {
            document.getElementById("masivoInput").value = "";
            document.getElementById("resumenMasivo").classList.add("d-none");
            renderizarTabla(datosCSVGlobal);
        }

        // Registro del Service Worker PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Activo'))
                .catch(err => console.error('Error SW:', err));
        }
    </script>
</body>
</html>
